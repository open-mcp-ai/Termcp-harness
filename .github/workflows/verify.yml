name: Verify

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-and-frontend:
    name: Runtime and frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Test Runtime
        run: go test -race ./cmd/... ./internal/...

      - name: Vet Runtime
        run: go vet ./cmd/... ./internal/...

      - name: Build Runtime
        run: go build ./cmd/... ./internal/...

      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: npm ci

      - name: Check frontend
        working-directory: desktop/frontend
        run: npm run check

      - name: Test frontend
        working-directory: desktop/frontend
        run: npm test

      - name: Build frontend
        working-directory: desktop/frontend
        run: npm run build

  windows-desktop:
    name: Windows Desktop
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: npm ci

      - name: Test Desktop Go packages
        run: go test -race ./desktop ./internal/coreterminal

      - name: Build frontend
        working-directory: desktop/frontend
        run: npm run build

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Build Wails Desktop
        working-directory: desktop
        shell: pwsh
        run: |
          $wails = Join-Path (go env GOPATH) "bin/wails.exe"
          & $wails build -s -skipbindings -m -nosyncgomod -nopackage -clean
